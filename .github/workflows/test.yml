# Runs the Playwright suite (npm test) in the cloud on every pull request and
# every push to main, so a change is checked before it is merged and again
# once it ships. The report is kept for a week when something fails.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Check the scripts parse
        run: |
          node --check app.js
          node --check shapes.js
          node --check service-worker.js

      - name: Run the tests
        run: npm test

      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
