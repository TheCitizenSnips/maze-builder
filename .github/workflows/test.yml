# Runs the Playwright suite (npm test) in the cloud on every pull request and
# every push to main, so a change is checked before it is merged and again
# once it ships. The report is kept for a week when something fails.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One machine per screen (desktop, iPad, iPhone) so the growing suite
  # finishes well inside the time limit.
  shard:
    name: playwright (${{ matrix.project }})
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, ipad, iphone]
    # Pinned: Playwright 1.56.1 cannot install Chromium on ubuntu-latest
    # once that moved to Ubuntu 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Full history: stale-page.spec.js serves an old release straight from git.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Check the scripts parse
        run: |
          node --check app.js
          node --check shapes.js
          node --check service-worker.js

      - name: Run the tests
        run: npm test -- --project=${{ matrix.project }}

      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 7

  # Keeps a single "playwright" check that passes only when every screen did.
  playwright:
    needs: shard
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Every screen passed
        run: test "${{ needs.shard.result }}" = success
